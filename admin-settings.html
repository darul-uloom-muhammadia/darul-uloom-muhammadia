<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Settings</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="top">Darul Uloom Muhammadiya Karachi — Admin Settings</div><main class="wrap section"><div class="card form"><h1>Admin Security</h1><p>Change the password for the currently signed-in admin account.</p><div id="msg" class="msg"></div><form id="form"><div class="field"><label>New Password</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>Confirm New Password</label><input id="confirm" type="password" minlength="8" required></div><button class="btn">Change Password</button></form><p><a href="admin.html">Back to Admin Dashboard</a></p></div></main><script>const msg=document.getElementById('msg');async function init(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user){location.href='admin.html';return}}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirm.value){msg.textContent='Passwords do not match.';msg.className='msg error';return}const {error}=await supabaseClient.auth.updateUser({password:password.value});if(error){msg.textContent=error.message;msg.className='msg error'}else{msg.textContent='Password changed successfully.';msg.className='msg success';e.target.reset()}});init();</script></body></html>
