<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Settings</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="logo-settings.js?v=20260817-1"></script></head><body><div class="top">Darul Uloom Muhammadiya Karachi — Admin Settings</div><main class="wrap section"><div class="card form"><h1>Website Settings</h1><section class="field"><label for="logoFile">Website Logo</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><small>Upload one logo here. It will be used wherever the website displays its logo on this browser.</small><div style="margin:16px 0"><img id="logoPreview" alt="Logo preview" style="max-width:180px;max-height:100px;object-fit:contain;display:block"></div><button type="button" class="btn" id="saveLogo">Save Logo</button> <button type="button" class="btn outline" id="removeLogo">Remove Logo</button><div id="logoMsg" class="msg"></div></section><hr><h2>Admin Security</h2><p>Change the password for the currently signed-in admin account.</p><div id="msg" class="msg"></div><form id="form"><div class="field"><label>New Password</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>Confirm New Password</label><input id="confirm" type="password" minlength="8" required></div><button class="btn">Change Password</button></form><p><a href="admin.html">Back to Admin Dashboard</a></p></div></main><script>const msg=document.getElementById('msg'),logoMsg=document.getElementById('logoMsg'),file=document.getElementById('logoFile'),preview=document.getElementById('logoPreview');function show(){const x=MadrasaLogo.get();preview.src=x||'';preview.style.display=x?'block':'none'}show();file.onchange=()=>{const f=file.files[0];if(f){const r=new FileReader();r.onload=()=>preview.src=r.result;r.readAsDataURL(f)}};document.getElementById('saveLogo').onclick=async()=>{try{await MadrasaLogo.save(file.files[0]);logoMsg.textContent='Logo saved successfully.';logoMsg.className='msg success';show()}catch(e){logoMsg.textContent=e.message;logoMsg.className='msg error'}};document.getElementById('removeLogo').onclick=()=>{MadrasaLogo.remove()};async function init(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user){location.href='admin.html';return}}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirm.value){msg.textContent='Passwords do not match.';msg.className='msg error';return}const {error}=await supabaseClient.auth.updateUser({password:password.value});if(error){msg.textContent=error.message;msg.className='msg error'}else{msg.textContent='Password changed successfully.';msg.className='msg success';e.target.reset()}});init();</script></body></html>
