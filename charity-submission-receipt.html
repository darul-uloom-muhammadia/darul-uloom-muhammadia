<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Donation Submission Receipt</title><style>body{font-family:Arial,sans-serif;background:#eef3f9;margin:0;color:#14243b}.receipt{max-width:760px;margin:35px auto;background:#fff;padding:42px;border-radius:18px;box-shadow:0 10px 40px #0001}.head{text-align:center;border-bottom:2px solid #0d47a1;padding-bottom:20px}.head h1{margin:10px 0 4px}.status{padding:14px;background:#fff7df;color:#795400;border-radius:10px;text-align:center;font-weight:800;margin:22px 0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{padding:10px 0;border-bottom:1px solid #e4eaf2}.label{font-size:12px;color:#66768c}.value{font-weight:800;margin-top:4px}.actions{text-align:center;margin-top:25px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.actions button,.actions a{border:0;background:#0d47a1;color:#fff;padding:11px 18px;border-radius:9px;font-weight:800;text-decoration:none;cursor:pointer}.note{color:#65748b;font-size:13px;line-height:1.6;margin-top:22px}@media print{body{background:#fff}.receipt{box-shadow:none;margin:0;max-width:none}.actions{display:none}}@media(max-width:600px){.receipt{margin:15px;padding:24px}.meta{grid-template-columns:1fr}}</style></head><body><main class="receipt"><div class="head"><h1>Jamia Darul Uloom Muhammadia Karachi</h1><p>Donation Submission Receipt</p></div><div id="content">Loading…</div><div class="actions"><button onclick="window.print()">Print / Save PDF</button><a href="index.html">Back to Website</a></div></main><script>const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));const d=JSON.parse(sessionStorage.getItem('charity_submission_receipt')||'null');if(!d){document.getElementById('content').innerHTML='<div class="status">This receipt is no longer available in this browser session.</div>'}else{const money=new Intl.NumberFormat('en-PK',{style:'currency',currency:'PKR'}).format(Number(d.amount||0));document.getElementById('content').innerHTML='<div class="status">✓ Donation submitted successfully — Pending administration verification</div><div class="meta"><div class="row"><div class="label">Submission ID</div><div class="value">'+esc(d.id)+'</div></div><div class="row"><div class="label">Submitted</div><div class="value">'+esc(new Date(d.submitted_at).toLocaleString())+'</div></div><div class="row"><div class="label">Donor</div><div class="value">'+esc(d.donor_name)+'</div></div><div class="row"><div class="label">Phone</div><div class="value">'+esc(d.phone)+'</div></div><div class="row"><div class="label">Charity Type</div><div class="value">'+esc(d.charity_type)+'</div></div><div class="row"><div class="label">Payment Method</div><div class="value">'+esc(d.payment_method)+'</div></div><div class="row"><div class="label">Payment Date & Time</div><div class="value">'+esc((d.payment_date||'')+' '+(d.payment_time||''))+'</div></div><div class="row"><div class="label">Amount</div><div class="value">'+esc(money)+'</div></div><div class="row"><div class="label">Reference</div><div class="value">'+esc(d.payment_reference||'—')+'</div></div></div><p class="note">Keep this receipt for your record. The payment proof has been submitted to the administration. The official verified receipt will be available after the administration verifies the donation.</p>'}</script></body></html>
