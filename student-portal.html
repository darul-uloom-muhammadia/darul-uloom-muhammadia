<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal | Darul Uloom Muhammadia Karachi</title><link rel="stylesheet" href="style.css"><style>.portal{min-height:100vh;background:#eaf3ff;padding:55px 0}.portal-card{max-width:720px;margin:auto;background:#fff;border:1px solid #dfe8f3;border-radius:20px;padding:34px;box-shadow:0 18px 50px rgba(10,45,90,.1)}.portal-tabs{display:flex;gap:8px;margin:22px 0}.portal-tabs button{flex:1;padding:12px;border:1px solid #dfe8f3;background:#fff;border-radius:9px;font-weight:700;cursor:pointer}.portal-tabs button.active{background:#071b3a;color:#fff}.portal-panel{display:none}.portal-panel.active{display:block}.status{padding:18px;background:#f6f9fd;border-radius:12px;margin-top:15px}.status b{color:#0d47a1}.back{display:inline-block;margin-bottom:20px;color:#0d47a1;text-decoration:none;font-weight:700}</style></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">☪</span><span><b>Darul Uloom Muhammadia</b><small>Karachi</small></span></a><a class="nav-admin" href="index.html">Website</a></div></header><main class="portal"><div class="container"><div class="portal-card"><a class="back" href="index.html">← Back to website</a><span class="eyebrow">STUDENT PORTAL</span><h1>Admission Account</h1><p>Students will be able to create an account, submit an admission application and securely check its status here.</p><div class="portal-tabs"><button class="active" data-tab="login">Login</button><button data-tab="register">Create Account</button><button data-tab="status">Check Status</button></div><section id="login" class="portal-panel active"><form class="form" id="loginForm"><input type="email" placeholder="Email Address" required><input type="password" placeholder="Password" required><button class="btn">LOGIN</button><p class="form-msg" id="loginMsg"></p></form></section><section id="register" class="portal-panel"><form class="form" id="registerForm"><input placeholder="Student Name" required><input placeholder="Father's Name" required><input type="email" placeholder="Email Address" required><input type="password" placeholder="Create Password" required><input placeholder="Phone Number" required><button class="btn">CREATE ACCOUNT</button><p class="form-msg" id="registerMsg"></p></form></section><section id="status" class="portal-panel"><form class="form" id="statusForm"><input placeholder="Application ID" required><button class="btn">CHECK APPLICATION STATUS</button><div id="statusMsg"></div></form></section></div></div></main><script>const buttons=document.querySelectorAll('.portal-tabs button');buttons.forEach(b=>b.onclick=()=>{buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.portal-panel').forEach(p=>p.classList.remove('active'));document.getElementById(b.dataset.tab).classList.add('active')});document.getElementById('registerForm').onsubmit=e=>{e.preventDefault();document.getElementById('registerMsg').textContent='Account registration is ready for the secure database connection. Your account and application data will not be stored until the database is connected.'};document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();document.getElementById('loginMsg').textContent='Secure student login will become active after the database/authentication connection is enabled.'};document.getElementById('statusForm').onsubmit=e=>{e.preventDefault();document.getElementById('statusMsg').innerHTML='<div class="status"><b>Application status:</b> Database connection required to retrieve your real application status.</div>'}</script></body></html>
