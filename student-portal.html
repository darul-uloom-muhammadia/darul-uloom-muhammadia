<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal | Darul Uloom Muhammadia Karachi</title><link rel="stylesheet" href="style.css"><style>.portal{min-height:100vh;background:#eaf3ff;padding:55px 0}.portal-card{max-width:820px;margin:auto;background:#fff;border:1px solid #dfe8f3;border-radius:20px;padding:34px;box-shadow:0 18px 50px rgba(10,45,90,.1)}.portal-tabs{display:flex;gap:8px;margin:22px 0}.portal-tabs button{flex:1;padding:12px;border:1px solid #dfe8f3;background:#fff;border-radius:9px;font-weight:700;cursor:pointer}.portal-tabs button.active{background:#071b3a;color:#fff}.portal-panel{display:none}.portal-panel.active{display:block}.status{padding:18px;background:#f6f9fd;border-radius:12px;margin-top:15px}.status b{color:#0d47a1}.back{display:inline-block;margin-bottom:20px;color:#0d47a1;text-decoration:none;font-weight:700}.hidden{display:none!important}.application{border:1px solid #dfe8f3;border-radius:14px;padding:18px;margin:12px 0}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#eaf3ff;color:#0d47a1;font-weight:700;font-size:13px}.small{font-size:13px;color:#667085}.error{color:#b42318}.success{color:#067647}.portal-header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:15px}.logout{border:1px solid #d0d5dd;background:white;border-radius:9px;padding:9px 14px;cursor:pointer}</style></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">☪</span><span><b>Darul Uloom Muhammadia</b><small>Karachi</small></span></a><a class="nav-admin" href="index.html">Website</a></div></header><main class="portal"><div class="container"><div class="portal-card"><a class="back" href="index.html">← Back to website</a><div class="portal-header"><div><span class="eyebrow">STUDENT PORTAL</span><h1>Admission Account</h1><p>Create your account, submit an admission application and check its status anytime.</p></div><button id="logoutBtn" class="logout hidden">Logout</button></div><div id="authTabs" class="portal-tabs"><button class="active" data-tab="login">Login</button><button data-tab="register">Create Account</button></div><section id="login" class="portal-panel active"><form class="form" id="loginForm"><input id="loginEmail" type="email" placeholder="Email Address" required><input id="loginPassword" type="password" placeholder="Password" required><button class="btn">LOGIN</button><p class="form-msg" id="loginMsg"></p></form></section><section id="register" class="portal-panel"><form class="form" id="registerForm"><input id="regName" placeholder="Student Name" required><input id="regFather" placeholder="Father's Name" required><input id="regEmail" type="email" placeholder="Email Address" required><input id="regPassword" type="password" minlength="6" placeholder="Create Password (minimum 6 characters)" required><input id="regPhone" placeholder="Phone Number"><input id="regAddress" placeholder="Address"><button class="btn">CREATE ACCOUNT</button><p class="form-msg" id="registerMsg"></p></form></section><section id="dashboard" class="portal-panel"><div class="status"><b id="welcome"></b><p class="small">Your applications are private and visible only to your account.</p></div><h2>New Admission Application</h2><form class="form" id="admissionForm"><input id="aName" placeholder="Student Name" required><input id="aFather" placeholder="Father's Name" required><input id="aDob" type="date"><select id="aCourse" required><option value="">Class / Course</option><option>Madrasa</option><option>Hifz-ul-Qur'an</option><option>Nazra Qur'an</option><option>School</option></select><input id="aPhone" placeholder="Phone Number" required><input id="aAddress" placeholder="Address"><textarea id="aMessage" placeholder="Message"></textarea><button class="btn">APPLY NOW</button><p class="form-msg" id="applicationMsg"></p></form><h2>My Applications</h2><div id="applications"><p class="small">Loading...</p></div></section></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(function(){const sb=window.supabaseClient;const tabs=document.querySelectorAll('.portal-tabs button');const panels=document.querySelectorAll('.portal-panel');const authTabs=document.getElementById('authTabs');const logout=document.getElementById('logoutBtn');function show(id){panels.forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}tabs.forEach(b=>b.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.tab)});function msg(id,text,cls){const el=document.getElementById(id);el.textContent=text;el.className='form-msg '+(cls||'')}async function loadApplications(user){authTabs.classList.add('hidden');show('dashboard');logout.classList.remove('hidden');const {data:profile}=await sb.from('student_profiles').select('*').eq('id',user.id).maybeSingle();document.getElementById('welcome').textContent='Welcome'+(profile?.full_name?' '+profile.full_name:'')+'!';if(profile){aName.value=profile.full_name||'';aFather.value=profile.father_name||'';aPhone.value=profile.phone||'';aAddress.value=profile.address||''}const {data,error}=await sb.from('admissions').select('*').eq('student_id',user.id).order('created_at',{ascending:false});const box=document.getElementById('applications');if(error){box.innerHTML='<p class="error">Unable to load applications right now.</p>';return}if(!data.length){box.innerHTML='<p class="small">No admission application submitted yet.</p>';return}box.innerHTML=data.map(a=>'<div class="application"><b>'+a.application_no+'</b> <span class="badge">'+a.status+'</span><p><b>Course:</b> '+a.course+'</p><p class="small">Submitted: '+new Date(a.created_at).toLocaleString()+'</p></div>').join('')}document.getElementById('registerForm').onsubmit=async e=>{e.preventDefault();msg('registerMsg','Creating account...');const email=regEmail.value.trim();const {data,error}=await sb.auth.signUp({email,password:regPassword.value,options:{data:{full_name:regName.value.trim(),father_name:regFather.value.trim(),phone:regPhone.value.trim(),address:regAddress.value.trim()}}});if(error){msg('registerMsg',error.message,'error');return}if(data.session){msg('registerMsg','Account created successfully.','success');await loadApplications(data.user)}else msg('registerMsg','Account created. Please check your email to confirm your account, then log in.','success')};document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();msg('loginMsg','Signing in...');const {data,error}=await sb.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(error){msg('loginMsg',error.message,'error');return}msg('loginMsg','');await loadApplications(data.user)};document.getElementById('admissionForm').onsubmit=async e=>{e.preventDefault();const {data:{user}}=await sb.auth.getUser();if(!user){msg('applicationMsg','Please log in first.','error');return}msg('applicationMsg','Submitting application...');const {error}=await sb.from('admissions').insert({student_id:user.id,student_name:aName.value.trim(),father_name:aFather.value.trim(),date_of_birth:aDob.value||null,course:aCourse.value,phone:aPhone.value.trim(),address:aAddress.value.trim(),message:aMessage.value.trim()});if(error){msg('applicationMsg',error.message,'error');return}msg('applicationMsg','Your admission enquiry has been received. Your application number and status are shown below.','success');aMessage.value='';aCourse.value='';await loadApplications(user)}logout.onclick=async()=>{await sb.auth.signOut();location.reload()};sb.auth.getSession().then(({data})=>{if(data.session)loadApplications(data.session.user)});sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session)loadApplications(session.user)})})();</script></body></html>
