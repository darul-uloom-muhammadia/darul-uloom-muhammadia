<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Forgot Password — Darul Uloom Muhammadiya</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 15% 20%,rgba(200,164,93,.22),transparent 28%),radial-gradient(circle at 85% 80%,rgba(58,123,213,.24),transparent 30%),linear-gradient(135deg,#041329,#0b3470 55%,#061a38)}.card{width:min(430px,88%);padding:38px;border-radius:26px;background:#fff;box-shadow:0 30px 90px #0005}.mark{margin:auto auto 15px;width:60px;height:60px;border-radius:17px;display:grid;place-items:center;background:#071b3a;color:#f4dfac;font-size:29px}.brand{text-align:center}.brand h1{color:#071b3a;margin:0}.brand p{color:#65748b;font-size:13px;margin:8px 0 25px}label{display:block;font-weight:700;font-size:13px;margin:15px 0 7px;color:#16243a}input{box-sizing:border-box;width:100%;height:50px;padding:0 13px;border:1px solid #d7dee8;border-radius:9px;font-size:15px}button{width:100%;height:50px;margin-top:20px;border:0;border-radius:9px;background:#0b3470;color:white;font-weight:700;font-size:15px;cursor:pointer}.msg{margin-top:15px;padding:11px;border-radius:9px;font-size:13px;display:none}.err{display:block;background:#fff0f0;color:#a32121}.ok{display:block;background:#effaf3;color:#176b3a}.back{text-align:center;margin-top:20px;font-size:13px}.back a{color:#0d47a1;font-weight:700;text-decoration:none}</style></head><body><main class="card"><div class="brand"><div class="mark">☾</div><h1>Forgot Password</h1><p>Darul Uloom Muhammadiya — Admin Account Recovery</p></div><form id="form"><label for="email">Admin Email Address</label><input id="email" type="email" autocomplete="email" value="bukharaofficial123@gmail.com" required><button id="btn" type="submit">Send Password Recovery</button><div id="msg" class="msg" role="alert"></div></form><div class="back"><a href="admin.html">← Back to Admin Login</a></div></main><script>const form=document.getElementById('form'),btn=document.getElementById('btn'),msg=document.getElementById('msg');const RECOVERY_REDIRECT='https://darul-uloom-muhammadia-62m8-one.vercel.app/reset-password.html';function show(t,c){msg.textContent=t;msg.className='msg '+c}form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Sending…';try{const email=document.getElementById('email').value.trim();const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:RECOVERY_REDIRECT});if(error)throw error;show('Recovery email sent. Open the newest email and follow its link to create a new password.','ok')}catch(e){show(e.message||'Unable to send recovery email.','err')}finally{btn.disabled=false;btn.textContent='Send Password Recovery'}});</script></body></html>
