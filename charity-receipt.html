<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Charity Receipt</title><style>body{font-family:Arial,sans-serif;background:#eef3f9;margin:0;color:#14243b}.receipt{max-width:760px;margin:35px auto;background:#fff;padding:42px;border-radius:18px;box-shadow:0 10px 40px #0001}.head{text-align:center;border-bottom:2px solid #0d47a1;padding-bottom:20px}.head img{width:74px;height:74px;object-fit:contain;border-radius:12px}.head h1{margin:10px 0 4px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.row{padding:10px 0;border-bottom:1px solid #e4eaf2}.label{font-size:12px;color:#66768c}.value{font-weight:800;margin-top:4px}.verified{padding:12px;background:#effaf3;color:#176b3a;border-radius:10px;text-align:center;font-weight:800}.actions{text-align:center;margin-top:25px}@media print{body{background:#fff}.receipt{box-shadow:none;margin:0;max-width:none}.actions{display:none}}@media(max-width:600px){.meta{grid-template-columns:1fr}}</style></head><body><main class="receipt"><div class="head"><div id="logo"></div><h1 id="name">Darul Uloom Muhammadia Karachi</h1><p>Official Charity Donation Receipt</p></div><div id="content">Loading…</div><div class="actions"><button onclick="window.print()">Print / Save PDF</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));async function go(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user){location.href='admin.html';return}const {data:a}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(!a){location.href='admin.html';return}const id=new URLSearchParams(location.search).get('id');if(!id)return;const {data:d,error}=await supabaseClient.from('charity_donations').select('*').eq('id',id).maybeSingle();if(error||!d){document.getElementById('content').textContent='Receipt not found.';return}const {data:s}=await supabaseClient.from('site_settings').select('content').eq('id','homepage').maybeSingle();const c=s?.content||{};document.getElementById('name').textContent=(c.brand?.name||'Darul Uloom Muhammadia')+' '+(c.brand?.city||'Karachi');if(c.brand?.logoImage)document.getElementById('logo').innerHTML='<img src="'+esc(c.brand.logoImage)+'" alt="Logo">';const money=new Intl.NumberFormat('en-PK',{style:'currency',currency:'PKR'}).format(Number(d.amount||0));document.getElementById('content').innerHTML='<div class="verified">PAYMENT VERIFIED • OFFICIAL RECEIPT</div><div class="meta"><div class="row"><div class="label">Receipt No.</div><div class="value">'+esc(d.receipt_no||'—')+'</div></div><div class="row"><div class="label">Verification Date</div><div class="value">'+esc(d.verified_at?new Date(d.verified_at).toLocaleString():'—')+'</div></div><div class="row"><div class="label">Donor</div><div class="value">'+esc(d.donor_name)+'</div></div><div class="row"><div class="label">Phone</div><div class="value">'+esc(d.phone)+'</div></div><div class="row"><div class="label">Charity Type</div><div class="value">'+esc(d.charity_type)+'</div></div><div class="row"><div class="label">Payment Method</div><div class="value">'+esc(d.payment_method||d.payment_type)+'</div></div><div class="row"><div class="label">Payment Date & Time</div><div class="value">'+esc((d.payment_date||'')+' '+(d.payment_time||''))+'</div></div><div class="row"><div class="label">Amount</div><div class="value">'+esc(money)+'</div></div><div class="row"><div class="label">Reference</div><div class="value">'+esc(d.payment_reference||'Hand-to-Hand / Cash')+'</div></div></div><p>'+esc(c.charity?.receiptNote||'Thank you for supporting Darul Uloom Muhammadia Karachi.')+'</p>'}go()</script></body></html>
