<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Intro Editor — Darul Uloom Muhammadiya</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{min-height:100vh;background:linear-gradient(135deg,#041329,#0b3470 55%,#061a38);font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic","Noto Sans Arabic",serif;color:#16243a}.wrap{width:min(900px,94%);margin:auto;padding:30px 0}.card{background:#fff;border-radius:22px;padding:28px;box-shadow:0 25px 70px rgba(0,0,0,.25);margin-bottom:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.head h1{margin:0;color:#071b3a}.btn{border:0;background:#0d47a1;color:#fff;padding:11px 18px;border-radius:9px;font-weight:700;cursor:pointer;text-decoration:none}.btn.green{background:#176b3a}.field{margin:16px 0}.field label{display:block;font-weight:800;margin-bottom:7px;color:#33455f}.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid #d6e0ec;border-radius:10px;padding:13px;background:#fff;font-family:inherit;font-size:18px;direction:rtl;text-align:right}.field textarea{min-height:220px;resize:vertical}.msg{display:none;padding:12px;border-radius:10px;margin-top:14px}.msg.show{display:block}.success{background:#effaf3;color:#176b3a}.error{background:#fff0f0;color:#a32121}.hint{color:#65748b;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}</style></head><body><main class="wrap"><section id="login" class="card"><h1>Admin Login</h1><p>تعارف نامہ تبدیل کرنے کے لیے اپنے Admin اکاؤنٹ سے لاگ اِن کریں۔</p><input id="email" type="email" placeholder="Email" style="width:100%;padding:12px;box-sizing:border-box"><input id="password" type="password" placeholder="Password" style="width:100%;padding:12px;box-sizing:border-box;margin-top:10px"><button class="btn" id="loginBtn" style="margin-top:10px">Login</button><div id="loginMsg" class="msg"></div></section><section id="editor" class="card" style="display:none"><div class="head"><div><h1>تعارف نامہ ایڈیٹر</h1><p class="hint">یہاں کی تبدیلیاں Save کرنے کے بعد ویب سائٹ کے Intro section میں ظاہر ہوں گی۔</p></div><div class="actions"><button class="btn green" id="save">محفوظ کریں</button><a class="btn" href="admin.html">Admin Dashboard</a><a class="btn" href="index.html" target="_blank">Website دیکھیں</a></div></div><div class="field"><label>عنوان</label><input id="title" value="تعارف نامہ"></div><div class="field"><label>تعارف کا متن</label><textarea id="body"></textarea></div><button class="btn green" id="save2">محفوظ کریں</button><div id="msg" class="msg"></div></section></main><script>const $=id=>document.getElementById(id);const msg=(id,text,type)=>{$(id).textContent=text;$(id).className='msg show '+type};async function isAdmin(u){if(!u)return false;const {data}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',u.id).maybeSingle();return !!data}async function load(){const {data,error}=await supabaseClient.from('site_settings').select('content').eq('id','homepage').maybeSingle();if(error)throw error;const c=data?.content||{};const intro=c.intro||c.taaruf||{};$('title').value=intro.title||'تعارف نامہ';$('body').value=intro.body||'جامعہ کے تعارف اور بنیادی معلومات کے لیے یہاں اپنا متن درج کریں۔'}async function open(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user||!await isAdmin(user))return;await load();$('login').style.display='none';$('editor').style.display='block'}async function login(){try{$('loginBtn').disabled=true;const {data,error}=await supabaseClient.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(!await isAdmin(data.user)){await supabaseClient.auth.signOut();throw new Error('یہ اکاؤنٹ Admin نہیں ہے۔')}await load();$('login').style.display='none';$('editor').style.display='block'}catch(e){msg('loginMsg',e.message||'Login failed','error')}finally{$('loginBtn').disabled=false}}async function save(){try{const {data:{user}}=await supabaseClient.auth.getUser();if(!user||!await isAdmin(user))throw new Error('Admin session expired.');const {data,error}=await supabaseClient.from('site_settings').select('content').eq('id','homepage').maybeSingle();if(error)throw error;const c=data?.content||{};c.intro={title:$('title').value.trim()||'تعارف نامہ',body:$('body').value.trim()};const r=await supabaseClient.from('site_settings').upsert({id:'homepage',content:c,updated_at:new Date().toISOString()});if(r.error)throw r.error;msg('msg','تعارف نامہ کامیابی سے محفوظ ہوگیا۔','success')}catch(e){msg('msg',e.message||'Save failed','error')}}$('loginBtn').onclick=login;$('save').onclick=save;$('save2').onclick=save;open();</script></body></html>
