<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Location & Leadership — Darul Uloom Muhammadiya</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{background:#f4f8ff;color:#16243a}.wrap{width:min(1000px,94%);margin:auto;padding:28px 0 60px}.card{background:#fff;border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 12px 40px rgba(0,0,0,.1)}h1,h2{color:#071b3a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d5dfeb;border-radius:9px}textarea{min-height:90px}.btn{border:0;border-radius:9px;padding:11px 18px;background:#0d47a1;color:#fff;font-weight:700;cursor:pointer}.btn.light{background:#edf4ff;color:#0d47a1}.photo{width:110px;height:110px;border-radius:14px;object-fit:cover;background:#eef3f8;display:block;margin-bottom:10px}.msg{padding:12px;border-radius:9px;margin:12px 0;display:none}.msg.show{display:block}.ok{background:#eaf8ef;color:#176b3a}.err{background:#fff0f0;color:#a32121}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h1>Location & Leadership</h1><p>Manage the public website location and leadership profiles.</p></div><a class="btn light" href="website-editor.html">Back to Website Editor</a></div><div id="msg" class="msg"></div></div><section class="card"><h2>📍 Location</h2><div class="grid"><div class="full"><label>Madrasa Address</label><input id="address"></div><div class="full"><label>Google Maps Link</label><input id="mapsUrl" placeholder="https://maps.google.com/..." ></div><div><label>Latitude</label><input id="lat"></div><div><label>Longitude</label><input id="lng"></div><div><label>Show Location on Website</label><select id="show"><option value="true">Yes</option><option value="false">No</option></select></div></div></section><section class="card"><h2>👤 Leadership</h2><div id="leaders"></div></section><div class="card"><button class="btn" id="save">Save & Publish</button></div></main><script>const $=id=>document.getElementById(id);let content={};function safe(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function msg(t,ok=false){$('msg').textContent=t;$('msg').className='msg show '+(ok?'ok':'err')}function render(){const b=content.brand||{};const loc=content.location||{};$('address').value=loc.address??b.address??'';$('mapsUrl').value=loc.mapsUrl??'';$('lat').value=loc.lat??'';$('lng').value=loc.lng??'';$('show').value=String(loc.show??true);const ls=content.leadership?.items||[['QB','Qari Muhammad Tayabb Bukhari Sahib','Founder',''],['AH','Molana Ameer Hamza Bukhari Sahib','Principal','']];$('leaders').innerHTML=ls.map((x,i)=>`<div class="card" style="box-shadow:none;border:1px solid #e1e8f0"><h3>Leader ${i+1}</h3><div class="grid"><div><label>Name</label><input data-l="${i}-1" value="${safe(x[1])}"></div><div><label>Designation</label><input data-l="${i}-2" value="${safe(x[2])}"></div><div class="full"><label>Short Information</label><textarea data-l="${i}-3">${safe(x[3]||'')}</textarea></div><div class="full"><label>Photo URL</label><input data-l="${i}-4" value="${safe(x[4]||'')}" placeholder="Upload via your existing media system or paste a public image URL"></div></div></div>`).join('')}async function init(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user){location.href='admin.html';return}const {data:a}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(!a){await supabaseClient.auth.signOut();location.href='admin.html';return}const {data}=await supabaseClient.from('site_settings').select('content').eq('id','homepage').maybeSingle();content=data?.content||{};render()}$('save').onclick=async()=>{const ls=(content.leadership?.items||[['QB','','',''],['AH','','','']]).map((x,i)=>[x[0],document.querySelector(`[data-l="${i}-1"]`).value.trim(),document.querySelector(`[data-l="${i}-2"]`).value.trim(),document.querySelector(`[data-l="${i}-3"]`).value.trim(),document.querySelector(`[data-l="${i}-4"]`).value.trim()]);content.location={address:$('address').value.trim(),mapsUrl:$('mapsUrl').value.trim(),lat:$('lat').value.trim(),lng:$('lng').value.trim(),show:$('show').value==='true'};content.brand=content.brand||{};content.brand.address=content.location.address;content.leadership=content.leadership||{};content.leadership.items=ls;const {data:{user}}=await supabaseClient.auth.getUser();const {error}=await supabaseClient.from('site_settings').upsert({id:'homepage',content,updated_by:user.id,updated_at:new Date().toISOString()},{onConflict:'id'});if(error)msg('Save failed: '+error.message);else msg('Location & Leadership saved and published successfully.',true)};init();</script></body></html>
