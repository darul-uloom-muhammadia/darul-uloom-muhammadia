<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset Password — Darul Uloom Muhammadiya</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 15% 20%,rgba(200,164,93,.22),transparent 28%),radial-gradient(circle at 85% 80%,rgba(58,123,213,.24),transparent 30%),linear-gradient(135deg,#041329,#0b3470 55%,#061a38)}.card{width:min(430px,88%);padding:38px;border-radius:26px;background:#fff;box-shadow:0 30px 90px #0005}.mark{margin:auto auto 15px;width:60px;height:60px;border-radius:17px;display:grid;place-items:center;background:#071b3a;color:#f4dfac;font-size:29px}.brand{text-align:center}.brand h1{color:#071b3a;margin:0}.brand p{color:#65748b;font-size:13px;margin:8px 0 25px}label{display:block;font-weight:700;font-size:13px;margin:15px 0 7px;color:#16243a}input{box-sizing:border-box;width:100%;height:50px;padding:0 13px;border:1px solid #d7dee8;border-radius:9px;font-size:15px}button{width:100%;height:50px;margin-top:20px;border:0;border-radius:9px;background:#0b3470;color:white;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:15px;padding:11px;border-radius:9px;font-size:13px;display:none}.err{display:block;background:#fff0f0;color:#a32121}.ok{display:block;background:#effaf3;color:#176b3a}.back{text-align:center;margin-top:20px;font-size:13px}.back a{color:#0d47a1;font-weight:700;text-decoration:none}</style></head><body><main class="card"><div class="brand"><div class="mark">☾</div><h1>Create New Password</h1><p>Darul Uloom Muhammadiya — secure account recovery</p></div><form id="form"><label for="password">New Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter a new password"><label for="confirm">Confirm Password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Confirm your new password"><button id="btn" type="submit">Update Password</button><div id="msg" class="msg" role="alert"></div></form><div class="back"><a href="admin.html">← Back to Admin Login</a></div></main><script>const form=document.getElementById('form'),btn=document.getElementById('btn'),msg=document.getElementById('msg');function show(t,c){msg.textContent=t;msg.className='msg '+c}async function checkSession(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session)show('This recovery link is invalid or has expired. Please request a new password recovery email.','err')}supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)show('Recovery link verified. Enter your new password below.','ok')});checkSession();form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8)return show('Password must be at least 8 characters.','err');if(p!==c)return show('Passwords do not match.','err');btn.disabled=true;btn.textContent='Updating…';try{const {data:{session}}=await supabaseClient.auth.getSession();if(!session)throw new Error('Recovery session is missing or expired. Please request a new recovery email.');const {error}=await supabaseClient.auth.updateUser({password:p});if(error)throw error;show('Password updated successfully. You can now sign in.','ok');setTimeout(()=>location.href='admin.html',1200)}catch(e){show(e.message||'Unable to update password.','err')}finally{btn.disabled=false;btn.textContent='Update Password'}});</script></body></html>
