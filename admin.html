<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Darul Uloom Muhammadiya</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body.admin-page{min-height:100vh;background:radial-gradient(circle at 15% 20%,rgba(200,164,93,.22),transparent 28%),radial-gradient(circle at 85% 80%,rgba(58,123,213,.24),transparent 30%),linear-gradient(135deg,#041329,#0b3470 55%,#061a38);display:flex;flex-direction:column}.admin-page .top{padding:18px 6%;color:#f4dfac;font-weight:700;letter-spacing:.5px;background:rgba(0,0,0,.14);border-bottom:1px solid rgba(255,255,255,.12)}.login-wrap{width:min(460px,92%);margin:auto;padding:45px 0}.login-card{background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.4);border-radius:26px;padding:38px;box-shadow:0 30px 90px rgba(0,0,0,.3)}.login-brand{text-align:center;margin-bottom:28px}.login-mark{width:62px;height:62px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;background:#071b3a;color:#f4dfac;font-size:30px;box-shadow:0 12px 28px rgba(7,27,58,.25)}.login-brand h1{margin:0;color:#071b3a;font-size:28px}.login-brand p{margin:7px 0 0;color:#65748b;font-size:13px}.login-card .field{margin-bottom:16px}.login-card label{display:block;margin-bottom:7px;font-weight:700;font-size:13px;color:#16243a}.login-card input{width:100%;height:50px}.login-card .btn{width:100%;height:50px;margin-top:8px;font-size:15px;cursor:pointer;pointer-events:auto}.login-card .btn:disabled{opacity:.65;cursor:not-allowed}.login-msg{display:none;margin:0 0 15px;padding:11px 13px;border-radius:9px;font-size:13px}.login-msg.error{display:block;background:#fff0f0;color:#a32121;border:1px solid #f1caca}.login-msg.success{display:block;background:#effaf3;color:#176b3a;border:1px solid #ccebd8}.back{text-align:center;margin-top:20px;font-size:13px}.back a{color:#0d47a1;text-decoration:none;font-weight:700}.forgot{text-align:center;margin-top:15px;font-size:13px}.forgot a{color:#0d47a1;text-decoration:none;font-weight:700}</style></head><body class="admin-page"><div class="top">Darul Uloom Muhammadiya Karachi · Administration</div><main class="login-wrap"><section id="login" class="login-card"><div class="login-brand"><div class="login-mark">☾</div><h1>Admin Login</h1><p>Secure access to the admission management system</p></div><div id="loginMsg" class="login-msg" role="alert"></div><form id="loginForm" novalidate><div class="field"><label for="email">Email Address</label><input id="email" name="email" type="email" autocomplete="username" placeholder="admin@example.com" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div><button class="btn" id="loginButton" type="submit">Login to Admin Panel</button></form><div class="forgot"><a href="forgot-password.html">Forgot Password?</a></div><div class="back"><a href="index.html">← Back to website</a></div></section><section id="dashboard" style="display:none"><div class="card"><div class="actions"><h1 style="margin-right:auto">Admission Dashboard</h1><button class="btn light" id="logout" type="button">Logout</button></div><p id="stats"></p><div style="overflow:auto"><table class="table"><thead><tr><th>Application</th><th>Student</th><th>Program</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script>const loginBox=document.getElementById('login'),dash=document.getElementById('dashboard'),form=document.getElementById('loginForm'),loginMsg=document.getElementById('loginMsg'),loginButton=document.getElementById('loginButton'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password');function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function message(text,type='error'){loginMsg.textContent=text;loginMsg.className='login-msg '+type}async function init(){try{const {data:{user}}=await supabaseClient.auth.getUser();if(user){const {data:a}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(a)showDash()}}catch(e){console.error(e)}}function showDash(){loginBox.style.display='none';dash.style.display='block';load()}form.addEventListener('submit',async e=>{e.preventDefault();if(!emailInput.value.trim()||!passwordInput.value){message('Please enter your email and password.');return}loginButton.disabled=true;loginButton.textContent='Signing in…';try{const {data,error}=await supabaseClient.auth.signInWithPassword({email:emailInput.value.trim(),password:passwordInput.value});if(error)throw error;const {data:a,error:adminError}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(adminError)throw adminError;if(!a){await supabaseClient.auth.signOut();throw new Error('This account is not an authorized admin.')}showDash()}catch(error){message(error.message||'Unable to sign in. Please try again.')}finally{loginButton.disabled=false;loginButton.textContent='Login to Admin Panel'}});document.getElementById('logout').onclick=async()=>{await supabaseClient.auth.signOut();location.reload()};async function load(){const {data,error}=await supabaseClient.from('applications').select('*').order('created_at',{ascending:false});if(error){alert(error.message);return}document.getElementById('stats').textContent='Total applications: '+data.length;document.getElementById('rows').innerHTML=data.map(a=>'<tr><td>'+esc(a.application_id)+'</td><td>'+esc(a.student_name)+'</td><td>'+esc(a.program)+'</td><td><select data-id="'+a.id+'">'+['Submitted','Under Review','Interview Scheduled','Accepted','Rejected','Waitlisted'].map(s=>'<option '+(s===a.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><button class="btn" type="button" onclick="save(\''+a.id+'\')">Save</button></td></tr>').join('')}async function save(id){const s=document.querySelector('select[data-id="'+id+'"]');const {error}=await supabaseClient.from('applications').update({status:s.value}).eq('id',id);if(error)alert(error.message);else load()}init();</script></body></html>
