<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Admissions</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="top">Darul Uloom Muhammadiya Karachi — Admin</div><nav class="nav"><a class="brand" href="index.html">Darul Uloom Muhammadiya</a><div class="navlinks"><a href="index.html">Website</a><a href="status.html">Student Status</a></div></nav><main class="wrap section"><div id="login" class="card form"><h1>Admin Login</h1><div id="loginMsg" class="msg"></div><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn">Login</button></form></div><div id="dashboard" style="display:none"><div class="card"><div class="actions"><h1 style="margin-right:auto">Admission Dashboard</h1><button class="btn light" id="logout">Logout</button></div><p id="stats"></p><div style="overflow:auto"><table class="table"><thead><tr><th>Application</th><th>Student</th><th>Program</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main><script>const loginBox=document.getElementById('login'),dash=document.getElementById('dashboard'),loginMsg=document.getElementById('loginMsg');function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function init(){const {data:{user}}=await supabaseClient.auth.getUser();if(user){const {data:a}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(a)showDash()}}function showDash(){loginBox.style.display='none';dash.style.display='block';load()}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const {data,error}=await supabaseClient.auth.signInWithPassword({email:email.value,password:password.value});if(error){loginMsg.textContent=error.message;loginMsg.className='msg error';loginMsg.style.display='block';return}const {data:a}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(!a){await supabaseClient.auth.signOut();loginMsg.textContent='This account is not an authorized admin.';loginMsg.className='msg error';loginMsg.style.display='block';return}showDash()});logout.onclick=async()=>{await supabaseClient.auth.signOut();location.reload()};async function load(){const {data,error}=await supabaseClient.from('applications').select('*').order('created_at',{ascending:false});if(error){alert(error.message);return}stats.textContent='Total applications: '+data.length;rows.innerHTML=data.map(a=>'<tr><td>'+esc(a.application_id)+'</td><td>'+esc(a.student_name)+'</td><td>'+esc(a.program)+'</td><td><select data-id="'+a.id+'">'+['Submitted','Under Review','Interview Scheduled','Accepted','Rejected','Waitlisted'].map(s=>'<option '+(s===a.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><button class="btn" onclick="save(\''+a.id+'\')">Save</button></td></tr>').join('')}async function save(id){const s=document.querySelector('select[data-id="'+id+'"]');const {error}=await supabaseClient.from('applications').update({status:s.value}).eq('id',id);if(error)alert(error.message);else load()}init();</script></body></html>
